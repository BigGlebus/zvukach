function sprite(key, x0, y0, w, h, k, draw) {
  key += '|' + k;
  let c = SPR.get(key);
  if (!c) {
    if (SPR.size > 400) SPR.clear();
    c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
    const sg = c.getContext('2d'); sg.scale(c.width / w, c.height / h); sg.translate(-x0, -y0); draw(sg);
    SPR.set(key, c);
    // an ImageBitmap stays ready on the GPU, so copying it every frame is cheaper than copying a canvas
    if (window.createImageBitmap) createImageBitmap(c).then(b => { if (SPR.get(key) === c) SPR.set(key, b); }).catch(() => {});
  }
  return c;
}
// current drawing scale (canvas pixels per game unit), rounded so the cache stays small

function resize() {

  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = W * s, ch = H * s;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = ((vw - cw) / 2) + 'px'; cv.style.top = ((vh - ch) / 2) + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}

function rrOn(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rr(x, y, w, h, r) { rrOn(g, x, y, w, h, r); }

function fitFont(text, max, min, maxW) {
  const key = text + '|' + max + '|' + maxW; let fs = FIT.get(key);

  fs = max; g.font = fs + 'px ' + FD; while (fs > min && g.measureText(text).width > maxW) { fs--; g.font = fs + 'px ' + FD; }

    const x = costCol(k), o = m.o(), cur = COST[m.k] || (COST[m.k] = {});
    if (inBtn({ x: x - 62, y: 262, w: 124, h: 36 }, p)) { const j = (PAL_SHIRT.indexOf(o.shirt) + 1) % PAL_SHIRT.length; o.shirt = cur.shirt = PAL_SHIRT[j]; blip(600 + j * 30, 0.06); }
    if (inBtn({ x: x - 62, y: 306, w: 124, h: 36 }, p)) { const j = (PAL_HAIR.indexOf(o.hair) + 1) % PAL_HAIR.length; o.hair = cur.hair = PAL_HAIR[j]; blip(800 + j * 30, 0.06); }
  });
  try { localStorage.setItem('zvukach_cost', JSON.stringify(COST)); } catch (e) {}
}
function drawCostume(tr) {
  dim(0.9);
  txt('КОСТЮМЫ ГРУППЫ', W / 2, 30, '22px ' + FD, C.orange, 'center', 'middle');
  txt('Тапай по кнопкам, чтобы перекрасить одежду и волосы', W / 2, 54, FI(400, 11), C.muted, 'center', 'middle');
  drawBtn(BTN.cBack);
  MEMBERS.forEach((m, k) => {
    const x = costCol(k), o = m.o(), bob = -Math.abs(Math.sin(tr * 3 + k)) * 3;
    circle(x, 220, 40, 'rgba(244,241,250,.05)');
    drawFigure(o, x, 220, 0.78, bob, -28, o.kind === 'vocal' ? -150 : 34);
    txt(m.n, x, 244, FI(800, 13), C.text, 'center', 'middle');
    [[262, 'Одежда', o.shirt], [306, 'Волосы', o.hair]].forEach(([y, lab, col]) => {
      rr(x - 62, y, 124, 36, 18); g.fillStyle = 'rgba(244,241,250,.08)'; g.fill(); g.strokeStyle = 'rgba(244,241,250,.25)'; g.lineWidth = 1.2; g.stroke();
      circle(x - 40, y + 18, 9, col); txt(lab + ' ▸', x + 8, y + 18.5, FI(700, 12), C.text, 'center', 'middle');
    });
  });
}

// ---------- main loop ----------
let lastFrame = rt();
// auto quality: during a song, if frames keep coming slower than ~42 per second, step the quality down (and remember it)
const PF = { n: 0, sum: 0, skip: 90 };
function perfTick(dt) {
  if (state !== 'play' || !run || QUAL === 0 || document.hidden) { PF.n = PF.sum = 0; PF.skip = Math.max(PF.skip, 45); return; }
  if (PF.skip > 0) { PF.skip--; return; }      // let the song settle first
  if (dt > 0.25) return;                       // a hiccup (tab switch, GC), not steady slowness
  PF.sum += dt; PF.n++;
  if (PF.n < 120) return;
  const avg = PF.sum / PF.n; PF.n = PF.sum = 0;
  if (avg > 0.024) { QUAL--; try { localStorage.setItem('zvukach_q', String(QUAL)); } catch (e) {} resize(); PF.skip = 90; }
}
// audio watchdog: if the sound stream dies while the audio clock says "running" (seen on Android after overload),
// the clock stops moving. Then stop the song, drop the dead context and let the next tap build a fresh one.
const AW = { ct: 0, at: 0 };
function audioWatch(tr) {
  if (!A || A.ctx.state !== 'running' || (state !== 'play' && state !== 'count')) { AW.at = tr; AW.ct = A ? A.ctx.currentTime : 0; return; }
  const ct = A.ctx.currentTime;
  if (ct > AW.ct + 0.001) { AW.ct = ct; AW.at = tr; return; }
  if (tr - AW.at < 2) return;
  const dead = A; quitToMenu(); A = null; AW.at = tr; if (typeof prevBus !== 'undefined') prevBus = null;
  try { dead.ctx.close().catch(() => {}); } catch (e) {}
  menuMsg = { text: 'Звук сбился — перезапустили его. Запусти песню ещё раз', t0: rt() };
}
function frame() {
  requestAnimationFrame(frame);
  const tr = rt(); perfTick(tr - lastFrame); lastFrame = tr; audioWatch(tr);
  const live = (state === 'play' || state === 'count') && run && A;
  if (live) {
    const R = run, t = aT();
    if (state === 'count' && t >= R.songStart) state = 'play';
    const b = Math.floor((t - R.songStart) / BEAT);
    while (R.lastBeat < b) { R.lastBeat++; if (R.lastBeat >= 0) onBeat(R.lastBeat); }
    while (R.ti < R.targets.length && R.targets[R.ti].t + 0.16 < t) {
      const tg = R.targets[R.ti];
      if (!tg.j) { if (tg.need) { tg.j = 'm'; R.miss++; addHype(R.mode === 'tut' ? -1 : DIFF.hypeMiss); breakCombo(); } else tg.j = 'skip'; }
      R.ti++;
    }
    if (R.mode === 'tut' && R.tEndAt && tr > R.tEndAt) { R.tEndAt = 0; afterTutorial(); return; }
    updateFans(tr); updateEvents(tr);
    if (state === 'play' && R.mode !== 'tut' && R.hype < 30 && tr > R.nextTomato) { spawnTomato(); R.nextTomato = tr + 0.7 + Math.random() * (0.6 + R.hype / 30 * 1.4); }
    if (R.mode !== 'tut' && t > R.songStart + TOTAL * BAR + 1.0 && !R.ended) finish();
  }
  const t = live ? aT() : tr;
  const songT = live ? t - run.songStart : tr;
  const hype = live ? run.hype : (state === 'end' && result ? result.hype : 68);
  const sh = tr - fx.shake < 0.18 ? (1 - (tr - fx.shake) / 0.18) * 6 : 0;
  g.save(); if (sh) g.translate((Math.random() - 0.5) * sh * 2, (Math.random() - 0.5) * sh * 2);
  drawScene(songT, hype, !!live, tr);
  if (live) { if (run.mode === 'tut') drawTutHUD(t, tr); else drawHUD(t, tr); drawControls(t, tr); if (run.mode === 'tut' && state === 'play') drawTutorial(t, tr); drawPopups(tr); if (state === 'count') drawCount(t); }
  drawSplats(true, tr);
  g.restore();
  if (sh) { g.strokeStyle = 'rgba(255,107,94,.5)'; g.lineWidth = 10; g.strokeRect(0, 0, W, H); }
  if (state === 'title') drawTitle(tr);
  else if (state === 'vocal') drawVocal(tr);
  else if (state === 'menu') drawMenu(tr);
  else if (state === 'calib') drawCalib(tr);
  else if (state === 'end') drawEnd(tr);
  else if (state === 'setlist') drawSetlist(tr);
  else if (state === 'interlude') drawInterlude(tr);
  else if (state === 'encoreAsk') drawEncore(tr);
  else if (state === 'cresult') drawCResult(tr);
  else if (state === 'costume') drawCostume(tr);
  if (state === 'interlude' && rt() - interT > 6) playConcertSong();
}
if (document.fonts && document.fonts.load) { document.fonts.load('20px "Russo One"').catch(() => {}); document.fonts.load('800 13px Inter').catch(() => {}); }
requestAnimationFrame(frame);
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  // A new version took over (sw.js does skipWaiting + clients.claim): reload into it as soon as no song is running.
  // Without this the old version stays on screen until the next launch. The very first install fires this event too,
  // so only reload when a version was already running; never mid-song or while the band-name dialog is open.
  const hadSW = !!navigator.serviceWorker.controller;
  let reloadPending = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || reloadPending) return;
    reloadPending = true;
    const tryReload = () => {
      if ((state === 'title' || state === 'menu') && !bandDlg.classList.contains('on')) location.reload();
      else setTimeout(tryReload, 1000);
    };
    tryReload();
  });
}
</script>
